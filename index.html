<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Guerriers Du Futur</title>
<link rel="icon" href="assets/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="pad" aria-hidden="true">
  <div class="dpad">
    <button data-key="ArrowUp" class="up">▲</button>
    <button data-key="ArrowLeft" class="left">◀</button>
    <button data-key="ArrowRight" class="right">▶</button>
    <button data-key="ArrowDown" class="down">▼</button>
  </div>
  <div class="actions">
    <button data-key="s" class="stats">S<small>STATS</small></button>
  </div>
</div>
<button id="mute" title="Son">🔊</button>
<script type="module" src="js/main.js"></script>
</body>
</html>
